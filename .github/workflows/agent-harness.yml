name: Agent Harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight harness dependencies
        run: python -m pip install pytest pyyaml
      - name: Run lightweight agent checks
        run: python scripts/agent_check.py --skip-pytest --skip-diff-check
      - name: Run harness eval suite
        run: python scripts/harness_eval.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python scripts/check_package.py

  tests:
    runs-on: ubuntu-latest
    # D94: report and presentation builders are local-only, so a clone cannot
    # build or test the reports. The report suite runs locally in `make agent-check`.
    strategy:
      fail-fast: false
      matrix:
        suite: [core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tested analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-analysis.txt
          python -m pip install -e .
          python -m pip check
      - name: Run research code and tooling tests
        if: matrix.suite == 'core'
        run: python -m pytest tests/ -m core -q
