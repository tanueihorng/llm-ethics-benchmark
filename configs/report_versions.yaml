        note: "Output of `make thesis`; standalone thesis master."

  # ---------------------------------------------------------------------
  - id: interim_classic
    label: Interim report (docx-js line)
    description: >
      The registry-backed interim master of 2026-07-10. Superseded for the
      T53 send action by the rewritten interim line, but still a live claim
