# Machine-readable registry of every FYP report / thesis / interim document
# version, its builder, and its status. Consumed by
# scripts/report_tools/report_version_diff.py (`all` regenerates
# docs/report_versions/ and docs/REPORT_VERSIONS.md) and enforced by
# tests/test_report_versions.py.
#
# Conventions
# -----------
# - `path` values are repo-relative and point at rendered .docx artifacts.
#   Per D60 (2026-08-10) every generated .docx is GITIGNORED — the builders
#   under scripts/ are the tracked deliverable. This registry therefore records
#   LOCAL artifacts; the gate skips existence checks on a fresh clone.
# - `status` vocabulary: canonical | selected | current-reference |
#   comparison-draft | fallback | reference | archived.
# - `decisions` cite PROJECT_LOG §3 decision IDs that establish the status.
# - `builder_provenance: name-inferred` marks builders inferred from the file
#   naming convention rather than pinned by a log row; everything else is
#   builder-exact.
# - Families with `diff: consecutive` get pairwise chapter/paragraph change
#   records. A chain gap (a version that never existed) is recorded explicitly
#   under `chain_notes` so absence stays auditable instead of silent.
version: 1

output_dir: docs/report_versions
index_path: docs/REPORT_VERSIONS.md

# Purpose-specific entry points; historical statuses below retain their meaning.
# D95 selects submission/final_report.docx for ongoing final-report editing;
# `final` names that student selection so tools resolve the deliverable by
# purpose, not by version (D96). The canonical build alias remains unchanged;
# LaTeX mirror migration is pending.
entrypoints:
  canonical: docs/FYP_Report_2026-07-01_v5.docx
  submitted: docs/rewritten_fyp_interim_progress.docx
  review: docs/rewritten_fyp_interim_progress_v2.docx
  final: submission/final_report.docx
frozen_outputs:
  - docs/rewritten_fyp_interim_progress.docx

# Clean-clone builds. Each path must have exactly one owning registry entry.
# Frozen/submitted-input derivatives require the student's local source artifact;
# they are checked when present locally, not reconstructed as the submitted copy.
build_profiles:
  ci:
    - docs/FYP_Report_2026-07-01_v5.docx
    - docs/FYP_Report_2026-07-25_v6.docx
    - docs/FYP_Thesis_2026-07-02_v4.docx
    - docs/FYP_Interim_2026-07-10.docx
    - docs/FYP_Report_2026-07-01_humanized.docx
    - docs/FYP_Thesis_2026-07-02_humanized.docx
    - docs/FYP_Interim_2026-07-10_humanized.docx
    - docs/rewritten_fyp_interim_v1.docx
    - docs/rewritten_fyp_report_v2.docx
    - docs/rewritten_fyp_interim_v3.docx
    - docs/rewritten_fyp_interim_v4.docx
    - docs/rewritten_fyp_interim_v5.docx

local_inputs:
  submission/final_report.docx: docs/rewritten_fyp_interim_progress_v3.docx
  docs/rewritten_fyp_interim_progress_humanized.docx: docs/rewritten_fyp_interim_progress.docx
  docs/rewritten_fyp_interim_progress_lit_review_revised.docx: docs/rewritten_fyp_interim_progress.docx
  docs/rewritten_fyp_interim_progress_v2.docx: docs/rewritten_fyp_interim_progress_lit_review_revised.docx
  docs/rewritten_fyp_interim_progress_v3.docx: docs/rewritten_fyp_interim_progress_v2.docx

# Retitle builders also emit their underlying full report. Require these outputs
# explicitly so corresponding tests cannot silently skip a broken side effect.
also_produces:
  docs/rewritten_fyp_interim_v1.docx: [docs/rewritten_fyp_report_v1.docx]
  docs/rewritten_fyp_interim_v3.docx: [docs/rewritten_fyp_report_v3.docx]
  docs/rewritten_fyp_interim_v4.docx: [docs/rewritten_fyp_report_v4.docx]
  docs/rewritten_fyp_interim_v5.docx: [docs/rewritten_fyp_report_v5.docx]

families:
  - id: final_submission
    label: Final report (merged interim v3 and final chapters)
    description: >-
      Student-selected final-report working document. Preserves interim v3
      Chapters 1–4 and incorporates the reviewed final Chapters 5–7.
    diff: none
    versions:
      - path: submission/final_report.docx
        label: Final report
        date: 2026-09-26
        builder: submission/build/build_final_report.py
        status: selected
        decisions: [D95]
        note: >-
          Local-only. Requires preserved interim progress v3, the final-chapter
          draft and interim progress v2 for citation identity mapping. Citations
          reconciled by bibliography identity; seven chapters and 63 references.
          Jev integration (T75) and final submission review remain pending.

  # ---------------------------------------------------------------------
  - id: report_canonical
    label: Full FYP report (docx-js line)
    description: >
      The original nine-chapter full report, built by the successive
      build_fyp_report*.js docx-js builders. v5 is the canonical build path
      (D41); v6 is the remediated comparison draft; earlier versions are
      archived history.
    diff: consecutive
    versions:
      - path: docs/archive/FYP_Report_2026-05-23.docx
        label: First full draft (2026-05-23)
        date: 2026-05-23
        builder: scripts/build_fyp_report.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Report_2026-05-24.docx
        label: Draft update (2026-05-24)
        date: 2026-05-24
