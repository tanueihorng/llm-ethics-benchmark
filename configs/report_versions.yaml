        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Report_2026-06-14.docx
        label: Draft update (2026-06-14)
        date: 2026-06-14
        builder: scripts/build_fyp_report.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Report_2026-06-26_v2.docx
        label: v2
        date: 2026-06-26
        builder: scripts/build_fyp_report_v2.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Report_2026-06-26_v3.docx
        label: v3
        date: 2026-06-26
        builder: scripts/build_fyp_report_v3.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Report_2026-06-30_v4.docx
        label: v4 (128-token era)
        date: 2026-06-30
        builder: scripts/build_fyp_report_v4.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/FYP_Report_2026-07-01_v5.docx
        label: v5 (512-token primary re-base)
        date: 2026-07-01
        builder: scripts/build_fyp_report_v5.js
        status: canonical
        decisions: [D41]
        note: Canonical `make report` output; 512-token-primary study.
      - path: docs/FYP_Report_2026-07-25_v6.docx
        label: v6 (remediated comparison draft)
        date: 2026-07-25
        builder: scripts/build_fyp_report_v6.js
        status: comparison-draft
        note: Live claim surface kept beside canonical v5 for comparison.

  # ---------------------------------------------------------------------
  - id: thesis_line
    label: Standalone thesis
    description: >
      The separate full research thesis (not touched by `make report`).
      Thesis v4 is the 512-primary mirrored master (D43).
    diff: consecutive
    versions:
