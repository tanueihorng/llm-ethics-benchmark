        date: 2026-08-22
        builder: scripts/build_rewritten_fyp_interim_v4.py
        status: fallback
        decisions: [D68, D70]
        note: Comprehensive 59-page fallback after D70 promotion and T67 remediation.
      - path: docs/rewritten_fyp_interim_compact.docx
        label: Interim compact (progress-centred)
        date: 2026-08-24
        builder: scripts/build_rewritten_fyp_interim_compact.py
        status: fallback
        decisions: [D71, D72]
        note: 36-page build; superseded for sending by the progress copy (D72).
      - path: docs/rewritten_fyp_interim_progress.docx
