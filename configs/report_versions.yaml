        date: 2026-06-26
        builder: scripts/build_fyp_thesis_v2.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/archive/FYP_Thesis_2026-06-26_v3.docx
        label: Thesis v3
        date: 2026-06-26
        builder: scripts/build_fyp_thesis_v3.js
        builder_provenance: name-inferred
        status: archived
      - path: docs/FYP_Thesis_2026-07-02_v4.docx
        label: Thesis v4 (512-primary mirror)
        date: 2026-07-02
        builder: scripts/build_fyp_thesis_v4.js
