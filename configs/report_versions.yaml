        status: selected
        decisions: [D72, D73]
        note: Uses supplied Ch1 + full v4 Ch2-4, replaces detailed scorer/discussion
          chapters with Ch5 Progress and Remaining Work; repaired in place 2026-08-25 (D73).
      - path: docs/rewritten_fyp_interim_v5.docx
        label: Interim v5 (retitle-only of rewrite v5)
        date: 2026-08-25
        builder: scripts/build_rewritten_fyp_interim_v5.py
        status: fallback
        decisions: [D75]
        note: >
          Same retitle-only contract as the other interim derivatives, over the
          v5 language-cleanup line (D75). Comprehensive fallback; the D73
          progress copy remains the selected T53 artifact.
      - path: docs/rewritten_fyp_interim_progress_humanized.docx
