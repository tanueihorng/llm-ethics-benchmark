  # ---------------------------------------------------------------------
  - id: rewrite_report
    label: Rewritten full report (plain-academic line)
    description: >
      The corpus-informed then plain-academic rewrite of the full report,
      built by Python (python-docx) builders. v3 carries the user-selected
      voice (D65); v4 adds the HW0288 funnel introduction (D66/D68).
    diff: consecutive
    chain_notes:
      - "No v0 exists: this line starts at rewritten_fyp_report_v1.docx (T52/D57)."
    versions:
      - path: docs/rewritten_fyp_report_v1.docx
        label: Rewrite v1 (corpus-informed)
        date: 2026-07-27
        builder: scripts/build_rewritten_fyp_report_v1.py
        status: reference
        decisions: [D57, D58, D59, D65]
        note: Demoted to reference by the user's D65 voice choice.
      - path: docs/rewritten_fyp_report_v2.docx
        label: Rewrite v2 (plain-academic pass)
        date: 2026-08-21
        builder: scripts/build_rewritten_fyp_report_v2.py
        status: comparison-draft
        decisions: [D63, D65]
        note: Dominated by v3 (430/480 shared paragraphs); kept for comparison.
      - path: docs/rewritten_fyp_report_v3.docx
        label: Rewrite v3 (selected plain-academic voice)
        date: 2026-08-21
        builder: scripts/build_rewritten_fyp_report_v3.py
        status: selected
        decisions: [D64, D65]
        note: The user-selected prose register for the submission line.
      - path: docs/rewritten_fyp_report_v4.docx
