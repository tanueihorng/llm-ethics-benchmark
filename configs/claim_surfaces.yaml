  # v6 = corpus-voice rewrite of report_docx (T47), remediated against the 2026-07-26
  # claim-to-source audit (T48). It was previously registered as a profile-less snapshot
  # because the locks match exact snippets and v6 rewords by design; that gap was audit
  # finding C01 — a green `make verify-claims` said nothing whatsoever about v6.
  #
  # T48 closed it. v6 now carries the FULL docx_primary lock set and passes it. Re-pointing
  # needed no lock changes and no waivers: all four initial failures were false positives
  # created by the voice rewrite, not by drifted numbers — a dropped serial comma in the
  # survivor list (the survivor-identity rule treats a comma as a clause boundary), a
  # colon-list that put "ASR" within 40 characters of "survival", and the Chapter 6
  # renumbering producing "Section 6.10 tests exactly this", which the volatile pytest-count
  # pattern read as a test count. All three were fixed in the prose, none by weakening a rule.
