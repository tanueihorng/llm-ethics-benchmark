  # swap touches the build and submission path, so it is a separate deliberate step.
  - {id: rewritten_interim_v1, path: docs/rewritten_fyp_interim_v1.docx, availability: gitignored_optional, lifecycle: generated, source: scripts/build_rewritten_fyp_interim_v1.py, profiles: [docx_primary, volatile_free, fresh_from_source]}
