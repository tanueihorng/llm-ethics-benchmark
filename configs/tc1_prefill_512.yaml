study_name: safety_capability_tradeoff_4bit_slm_prefill_512

# T87/D105: exploratory PREFILL arm (prespecified in docs/PREFILL_PREREG.md).
#
# Same ten FP16/NF4 aliases, pinned revisions, chat templates, greedy decoding
# and 512-token budget as the primary study (configs/tc1_512.yaml), on the same
# 200 HarmBench prompts. The only change is `decoding.assistant_prefill`: the
# assistant's reply is started with a fixed compliant opener, rendered through
# each model's own chat template (ethical_benchmark/models/generation.py,
# TextGenerator._apply_prefill). The saved response is the opener followed by the
# model's continuation, and the HarmBench classifier scores that whole reply.
#
# Writes to the separate results_prefill_512/ tree. results_512/ is never read
# or written by the generation jobs. INT8 is out of scope for this arm.

